# CI 工作流
# 测试（四矩阵）+ 构建验证
#
# 发布模型说明：Release 附件由**本地确定性构建 + 手工上传**，sha256 记入
# plan/RELEASE-M6.md 台账。CI **不**自动发 Release，原因：
#   ① PyInstaller 产物不承诺跨机字节一致 —— CI 构建的 exe 哈希必与台账不同，
#      自动上传会让"附件哈希可对账"失效；
#   ② `release: published` 触发会与发版动作形成重跑循环。
# CI 的职责 = **验证**（干净 runner 上四矩阵测试 + exe 能构建且能运行）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 历史扫描类守门需要完整历史

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 编码守卫：CI job 里 python 不是我们敲的命令、没有 -X utf8，
      # 且子进程解码走 locale —— 故在 job 级设 PYTHONUTF8（救全部步骤）
      - name: Enable UTF-8
        run: echo "PYTHONUTF8=1" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run coverage
        run: pytest tests/ --cov=src/hws_formal_math --cov-report=xml

      # 安装面第四面：裸 console-script 与 python -m 是两条通路
      # （sys.path 来源不同），只跑一种会漏掉"我们的包没进安装面"这类缺陷
      - name: Smoke test (bare console script)
        run: hws-formal-math selftest

      - name: Smoke test (python -m)
        run: python -m hws_formal_math selftest

      # 基准达标验证（run 得动的套件）。skeleton 套件需 Lean 内核真值，
      # CI 无 Lean → 该套件按 not_enabled 报告（不冒充通过），故单跑另两套。
      - name: Benchmark (retrieval + depgraph)
        run: |
          hws-formal-math bench --suite retrieval
          hws-formal-math bench --suite depgraph

      # 断言"未启用"套件被如实报告（不冒充通过）
      - name: Assert skeleton suite reports not_enabled
        run: |
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "-m", "hws_formal_math", "bench", "--suite", "skeleton"],
                               capture_output=True, text=True, encoding="utf-8")
          out = r.stdout + r.stderr
          assert "未启用" in out, out
          assert r.returncode == 1, f"未启用套件应 exit 1，实际 {r.returncode}"
          print("OK: skeleton suite honestly reports not_enabled")
          PY
        shell: bash

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable UTF-8
        run: echo "PYTHONUTF8=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build pyinstaller

      - name: Build sdist
        run: python -m build --sdist

      - name: Build wheel
        run: python -m build --wheel

      - name: Build CLI exe
        run: pyinstaller --noconfirm tools/hws-formal-math.spec

      - name: Verify frozen exe (selftest + bench)
        run: |
          ./dist/hws-formal-math/hws-formal-math selftest
          ./dist/hws-formal-math/hws-formal-math bench --suite retrieval
          ./dist/hws-formal-math/hws-formal-math bench --suite depgraph

      - name: Package release artifacts (确定性打包自测)
        run: |
          python tools/package_release.py --dist dist --output release --tag v0.0.0-ci
          ls -la release/

      # 打包确定性自测：两次独立打包必须逐字节一致
      - name: Assert packaging determinism
        run: |
          python tools/package_release.py --dist dist --output release2 --tag v0.0.0-ci
          sha256sum release/*.zip release2/*.zip
          test "$(sha256sum release/*.zip | cut -d' ' -f1)" = "$(sha256sum release2/*.zip | cut -d' ' -f1)"
          echo "OK: 打包确定性通过（两次独立打包逐字节一致）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/hws-formal-math
